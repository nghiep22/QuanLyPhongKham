openapi: 3.1.0
info:
  title: Private Clinic API
  version: 0.4.0
  description: Public contract for the private clinic management system.
servers:
  - url: http://localhost:5000
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the Gateway process is alive
      responses:
        '200':
          description: Gateway is alive. This check does not depend on SQL Server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data:
                  status: ok
                  service: clinic-gateway
                meta: {}
                requestId: 74ed3a7b-d580-448a-8570-22cb2345c6be
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check Gateway and downstream service readiness
      responses:
        '200':
          description: Gateway and required downstream dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /.well-known/jwks.json:
    get:
      operationId: getAuthJwks
      summary: Get public keys used to verify access tokens
      responses:
        '200':
          description: JSON Web Key Set for RS256 verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with username, email, or phone
      description: Web clients receive the rotating refresh token in an HttpOnly cookie. Mobile clients receive it in the response body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: Present for web clients; contains the HttpOnly refresh token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          description: Account is temporarily locked after repeated failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: Send an empty object when using the web cookie, or send refreshToken for a mobile client. Reuse of an already-rotated token revokes all sessions for that user.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logout is idempotent and has completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session belonging to the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All sessions were revoked and the user's token version was incremented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutAllResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      summary: Change the authenticated user's password and revoke every session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed and every session was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Request a one-time password reset link
      description: Always returns the same accepted response, regardless of whether the identifier exists or is deliverable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: The request was accepted without revealing account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Consume a one-time reset token and revoke every existing session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset and every session was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/patient-registration/request:
    post:
      operationId: requestPatientRegistration
      summary: Start a patient self-registration and send a one-time verification code
      description: The accepted response does not reveal whether the contact already belongs to an account.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegistrationRequest'
      responses:
        '202':
          description: Registration request accepted without disclosing contact availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRegistrationAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/patient-registration/verify:
    post:
      operationId: verifyPatientRegistration
      summary: Verify a patient registration OTP and create the portal account and SELF profile link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegistrationVerificationRequest'
      responses:
        '201':
          description: Patient account, profile, and verified SELF link created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRegistrationCompletedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/patient-access/reference-data:
    get:
      operationId: getPatientLinkReferenceData
      summary: List active branches that can receive a patient-link request
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Branch choices for an authenticated patient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkReferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/patient-access:
    get:
      operationId: getPatientAccess
      summary: List accessible patient profiles, delegated users, and the caller's link requests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current portal access and request history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/patient-access/requests:
    post:
      operationId: requestPatientLink
      summary: Request access to an existing patient profile
      description: A request that does not match a patient is accepted as a decoy and never appears in the staff queue.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientLinkRequest'
      responses:
        '202':
          description: The request was accepted without revealing whether the patient reference matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkRequestAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/patient-access/requests/{requestId}:
    delete:
      operationId: cancelPatientLinkRequest
      summary: Cancel the authenticated patient's pending link request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientLinkRequestId'
      responses:
        '200':
          description: The pending request was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkCancelledResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/patient-access/links/{linkId}:
    delete:
      operationId: revokeOwnPatientLink
      summary: Revoke the caller's non-SELF link or delegated access to the caller's SELF profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientLinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientLinkReasonRequest'
      responses:
        '200':
          description: The link was revoked and can no longer book appointments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkRevokedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/patient-link-requests/reference-data:
    get:
      operationId: getManagedPatientLinkReferenceData
      summary: List branches where the staff member may manage patient portal links
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authorized branch choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkReferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/patient-link-requests:
    get:
      operationId: listPatientLinkRequests
      summary: List matched patient-link requests in one authorized branch
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: branchPublicId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/PatientLinkRequestStatus'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of link requests. Decoy requests are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPatientLinkRequestListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/patient-link-requests/{requestId}/decision:
    post:
      operationId: decidePatientLinkRequest
      summary: Approve or reject a pending patient-link request with optimistic concurrency
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientLinkRequestId'
        - $ref: '#/components/parameters/PatientLinkIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientLinkDecisionRequest'
      responses:
        '200':
          description: The request was decided and an approved link was activated atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkDecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/admin/patient-links/{linkId}:
    delete:
      operationId: revokePatientLinkAsStaff
      summary: Revoke a patient portal link as authorized staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientLinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientLinkReasonRequest'
      responses:
        '200':
          description: The link was revoked with an audit reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkRevokedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/staff/reference-data:
    get:
      operationId: getStaffReferenceData
      summary: Get branches, assignable roles, and specialties in the actor's scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workforce reference data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/staff:
    get:
      operationId: listStaff
      summary: List staff in an authorized branch scope
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          schema:
            type: string
            maxLength: 100
        - in: query
          name: branchPublicId
          schema:
            type: string
            format: uuid
        - in: query
          name: employeeType
          schema:
            $ref: '#/components/schemas/EmployeeType'
        - in: query
          name: accountStatus
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of staff accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createStaff
      summary: Atomically create an account, employee profile, doctor profile, and default branch role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Staff account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/staff/{staffId}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      operationId: getStaff
      summary: Get one staff account and its effective role assignments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staff details.
          headers:
            ETag:
              $ref: '#/components/headers/StaffEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateStaff
      summary: Update a complete staff profile using optimistic concurrency
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
      responses:
        '200':
          description: Updated staff details.
          headers:
            ETag:
              $ref: '#/components/headers/StaffEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/admin/users/{userId}/status:
    put:
      operationId: setStaffAccountStatus
      summary: Activate or disable a staff account and revoke existing sessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccountStatusRequest'
      responses:
        '200':
          description: Updated staff details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/users/{userId}/unlock:
    post:
      operationId: unlockStaffAccount
      summary: Unlock a staff account after administrative verification
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Updated staff details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/users/{userId}/roles:
    post:
      operationId: grantStaffRole
      summary: Grant a time-bounded global or branch role
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRoleRequest'
      responses:
        '200':
          description: Updated staff details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/users/{userId}/roles/{assignmentId}:
    delete:
      operationId: revokeStaffRole
      summary: Revoke an active role assignment with a reason
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Updated staff details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/public/branches:
    get:
      operationId: listPublicBranches
      summary: List active clinic branches available for online booking
      responses:
        '200':
          description: Active public branch directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBranchListResponse'
  /api/v1/public/specialties:
    get:
      operationId: listPublicSpecialties
      summary: List active specialties
      responses:
        '200':
          description: Active public specialty directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSpecialtyListResponse'
  /api/v1/public/services:
    get:
      operationId: listPublicServices
      summary: List services currently available and priced at a branch
      parameters:
        - $ref: '#/components/parameters/BranchPublicIdQuery'
        - name: specialtyPublicId
          in: query
          schema:
            type: string
            format: uuid
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Booking-facing service directory with effective VND prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicServiceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/public/doctors:
    get:
      operationId: listPublicDoctors
      summary: List active doctors who accept online booking
      parameters:
        - name: branchPublicId
          in: query
          schema:
            type: string
            format: uuid
        - name: specialtyPublicId
          in: query
          schema:
            type: string
            format: uuid
        - name: servicePublicId
          in: query
          schema:
            type: string
            format: uuid
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Booking-facing doctor directory without private workforce fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDoctorListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/admin/catalog/reference-data:
    get:
      operationId: getCatalogReferenceData
      summary: Get manageable branches and catalog references
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catalog reference data scoped to the actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogReferenceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/catalog/rooms:
    get:
      operationId: listCatalogRooms
      summary: List rooms in a manageable branch
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BranchPublicIdQuery'
      responses:
        '200':
          description: Rooms in the selected branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRoomListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCatalogRoom
      summary: Create a room in a manageable branch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogRoomRequest'
      responses:
        '201':
          description: Room created.
          headers:
            ETag:
              $ref: '#/components/headers/CatalogEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/catalog/rooms/{roomId}:
    put:
      operationId: updateCatalogRoom
      summary: Update a room with optimistic concurrency
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CatalogIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogRoomRequest'
      responses:
        '200':
          description: Room updated.
          headers:
            ETag:
              $ref: '#/components/headers/CatalogEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/admin/catalog/services:
    get:
      operationId: listCatalogServices
      summary: List organization services and branch price history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BranchPublicIdQuery'
      responses:
        '200':
          description: Organization services with selected-branch prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogServiceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCatalogService
      summary: Create an organization-wide service
      description: Requires a global MASTER_DATA_MANAGE assignment. Branch managers cannot create organization catalog definitions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BranchPublicIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogServiceRequest'
      responses:
        '201':
          description: Organization service created.
          headers:
            ETag:
              $ref: '#/components/headers/CatalogEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogServiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/catalog/services/{serviceId}:
    put:
      operationId: updateCatalogService
      summary: Update an organization-wide service with optimistic concurrency
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/BranchPublicIdQuery'
        - $ref: '#/components/parameters/CatalogIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogServiceRequest'
      responses:
        '200':
          description: Organization service updated.
          headers:
            ETag:
              $ref: '#/components/headers/CatalogEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogServiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/v1/admin/catalog/services/{serviceId}/prices:
    post:
      operationId: setCatalogBranchPrice
      summary: Schedule a branch price and availability change
      security:
        - bearerAuth: []
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCatalogBranchPriceRequest'
      responses:
        '201':
          description: Branch price period scheduled without overlap.
          headers:
            ETag:
              $ref: '#/components/headers/CatalogEtag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogServiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the Base64 employee rowversion and optional doctor rowversion.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}=(:[A-Za-z0-9+/]{11}=)?"$'
    CatalogIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the Base64 rowversion of a catalog resource.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}="$'
    BranchPublicIdQuery:
      name: branchPublicId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID that makes retries with the same operation payload return the original result.
      schema:
        type: string
        format: uuid
    PatientLinkRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientLinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientLinkIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the Base64 rowversion of the patient-link request.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}="$'
  headers:
    CatalogEtag:
      description: Strong ETag containing the Base64 SQL rowversion.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}="$'
    StaffEtag:
      description: Strong ETag for optimistic concurrency.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}=(:[A-Za-z0-9+/]{11}=)?"$'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication data is missing, invalid, expired, reused, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: The account is unavailable for login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: The requested resource does not exist in the caller's scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: The operation conflicts with uniqueness, concurrency, or account safety rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    PreconditionRequired:
      description: The If-Match precondition is required for this update.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: A required registration dependency is unavailable.
      content:
        application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: The caller exceeded the request rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    ResponseMeta:
      type: object
      additionalProperties: true
    RequestId:
      type: string
      format: uuid
    HealthData:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/HealthData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    DependencyHealth:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        database:
          type: string
    ReadinessData:
      type: object
      additionalProperties: false
      required: [status, service, dependencies]
      properties:
        status:
          type: string
          const: ready
        service:
          type: string
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyHealth'
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/ReadinessData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    ClientType:
      type: string
      enum: [web, mobile]
      default: web
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Username, normalized email address, or normalized phone number.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 200
        clientType:
          $ref: '#/components/schemas/ClientType'
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Required for mobile clients and omitted when using the web HttpOnly cookie.
    StrongPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 200
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).+$'
      description: At least 12 characters with lowercase, uppercase, and a digit.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 200
        newPassword:
          $ref: '#/components/schemas/StrongPassword'
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Username, normalized email address, or normalized phone number.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: One-time opaque token received through the configured recovery channel.
        newPassword:
          $ref: '#/components/schemas/StrongPassword'
    PasswordResetAcceptedData:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
    PasswordChangedData:
      type: object
      additionalProperties: false
      required: [passwordChanged, allSessionsRevoked]
      properties:
        passwordChanged:
          type: boolean
          const: true
        allSessionsRevoked:
          type: boolean
          const: true
    PasswordResetAcceptedResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PasswordResetAcceptedData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    PasswordChangedResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PasswordChangedData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    ContactChannel:
      type: string
      enum: [EMAIL, SMS]
    PatientRegistrationRequest:
      type: object
      additionalProperties: false
      required: [contactChannel, contact, password, fullName, dateOfBirth, gender]
      properties:
        contactChannel:
          $ref: '#/components/schemas/ContactChannel'
        contact:
          type: string
          minLength: 3
          maxLength: 254
          description: Email address or phone number matching contactChannel.
        password:
          $ref: '#/components/schemas/StrongPassword'
        fullName:
          type: string
          minLength: 2
          maxLength: 200
        dateOfBirth:
          type: string
          format: date
          example: '1990-01-01'
        gender:
          $ref: '#/components/schemas/Gender'
    PatientRegistrationVerificationRequest:
      type: object
      additionalProperties: false
      required: [challengeId, otp]
      properties:
        challengeId:
          type: string
          format: uuid
        otp:
          type: string
          pattern: '^\d{6}$'
    PatientRegistrationAcceptedData:
      type: object
      additionalProperties: false
      required: [challengeId, expiresIn, resendAfter]
      properties:
        challengeId:
          type: string
          format: uuid
        expiresIn:
          type: integer
          minimum: 180
          description: Maximum OTP lifetime in seconds.
        resendAfter:
          type: integer
          minimum: 1
          description: Minimum delay before submitting a new registration request.
    RegisteredPatientReference:
      type: object
      additionalProperties: false
      required: [publicId, code]
      properties:
        publicId:
          type: string
          format: uuid
        code:
          type: string
    PatientRegistrationCompletedData:
      type: object
      additionalProperties: false
      required: [registered, patient]
      properties:
        registered:
          type: boolean
          const: true
        patient:
          $ref: '#/components/schemas/RegisteredPatientReference'
    PatientRegistrationAcceptedResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PatientRegistrationAcceptedData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    PatientRegistrationCompletedResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PatientRegistrationCompletedData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    PatientRelationship:
      type: string
      enum: [SELF, CHILD, SPOUSE, PARENT, GUARDIAN, OTHER]
    PatientLinkRequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED, EXPIRED]
    PatientLinkReferenceData:
      type: object
      additionalProperties: false
      required: [branches]
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/BranchReference'
    PatientLinkReferenceResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PatientLinkReferenceData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    CreatePatientLinkRequest:
      type: object
      additionalProperties: false
      required: [branchPublicId, patientCode, dateOfBirth, relationshipType]
      properties:
        branchPublicId:
          type: string
          format: uuid
        patientCode:
          type: string
          minLength: 2
          maxLength: 30
        dateOfBirth:
          type: string
          format: date
        relationshipType:
          $ref: '#/components/schemas/PatientRelationship'
        requestNote:
          type: string
          maxLength: 500
          description: Required for a relationship other than SELF.
    PatientProfileReference:
      type: object
      additionalProperties: false
      required: [publicId, code, fullName, dateOfBirth]
      properties:
        publicId:
          type: string
          format: uuid
        code:
          type: string
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
    PatientLinkUserReference:
      type: object
      additionalProperties: false
      required: [publicId, displayName]
      properties:
        publicId:
          type: string
          format: uuid
        displayName:
          type: string
    PatientLinkVerifiedBranch:
      type: object
      additionalProperties: false
      required: [publicId, name]
      properties:
        publicId:
          type: string
          format: uuid
        name:
          type: string
    PatientAccessLink:
      type: object
      additionalProperties: false
      required:
        - publicId
        - patient
        - relationshipType
        - status
        - bookingAllowed
        - accessKind
        - linkedUser
        - verifiedBranch
        - verifiedAtUtc
        - canRevoke
        - rowVersion
      properties:
        publicId:
          type: string
          format: uuid
        patient:
          $ref: '#/components/schemas/PatientProfileReference'
        relationshipType:
          $ref: '#/components/schemas/PatientRelationship'
        status:
          type: string
          const: ACTIVE
        bookingAllowed:
          type: boolean
        accessKind:
          type: string
          enum: [OWN, DELEGATED]
        linkedUser:
          $ref: '#/components/schemas/PatientLinkUserReference'
        verifiedBranch:
          oneOf:
            - $ref: '#/components/schemas/PatientLinkVerifiedBranch'
            - type: 'null'
        verifiedAtUtc:
          type: [string, 'null']
          format: date-time
        canRevoke:
          type: boolean
        rowVersion:
          type: string
          pattern: '^[A-Za-z0-9+/]{11}=$'
    PatientLinkRequest:
      type: object
      additionalProperties: false
      required:
        - publicId
        - branch
        - patientReference
        - relationshipType
        - requestNote
        - status
        - decisionReason
        - createdAtUtc
        - expiresAtUtc
        - decidedAtUtc
        - patient
        - rowVersion
      properties:
        publicId:
          type: string
          format: uuid
        branch:
          $ref: '#/components/schemas/BranchReference'
        patientReference:
          type: string
        relationshipType:
          $ref: '#/components/schemas/PatientRelationship'
        requestNote:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PatientLinkRequestStatus'
        decisionReason:
          type: [string, 'null']
        createdAtUtc:
          type: string
          format: date-time
        expiresAtUtc:
          type: string
          format: date-time
        decidedAtUtc:
          type: [string, 'null']
          format: date-time
        patient:
          oneOf:
            - type: object
              additionalProperties: false
              required: [publicId, code, fullName]
              properties:
                publicId:
                  type: string
                  format: uuid
                code:
                  type: string
                fullName:
                  type: string
            - type: 'null'
        rowVersion:
          type: string
          pattern: '^[A-Za-z0-9+/]{11}=$'
    StaffPatientLinkRequester:
      type: object
      additionalProperties: false
      required: [publicId, displayName, email, phone]
      properties:
        publicId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
    StaffPatientLinkRequest:
      type: object
      additionalProperties: false
      required:
        - publicId
        - branch
        - patientReference
        - relationshipType
        - requestNote
        - status
        - decisionReason
        - createdAtUtc
        - expiresAtUtc
        - decidedAtUtc
        - patient
        - requester
        - rowVersion
      properties:
        publicId:
          type: string
          format: uuid
        branch:
          $ref: '#/components/schemas/BranchReference'
        patientReference:
          type: string
        relationshipType:
          $ref: '#/components/schemas/PatientRelationship'
        requestNote:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PatientLinkRequestStatus'
        decisionReason:
          type: [string, 'null']
        createdAtUtc:
          type: string
          format: date-time
        expiresAtUtc:
          type: string
          format: date-time
        decidedAtUtc:
          type: [string, 'null']
          format: date-time
        patient:
          $ref: '#/components/schemas/PatientProfileReference'
        requester:
          $ref: '#/components/schemas/StaffPatientLinkRequester'
        rowVersion:
          type: string
          pattern: '^[A-Za-z0-9+/]{11}=$'
    PatientAccessData:
      type: object
      additionalProperties: false
      required: [links, requests]
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/PatientAccessLink'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/PatientLinkRequest'
    PatientAccessResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PatientAccessData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    PatientLinkRequestAcceptedData:
      type: object
      additionalProperties: false
      required: [requestId, status]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          const: PENDING
    PatientLinkRequestAcceptedResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PatientLinkRequestAcceptedData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    PatientLinkReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    PatientLinkCancelledData:
      type: object
      additionalProperties: false
      required: [cancelled]
      properties:
        cancelled:
          type: boolean
          const: true
    PatientLinkCancelledResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PatientLinkCancelledData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    PatientLinkRevokedData:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked:
          type: boolean
          const: true
    PatientLinkRevokedResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/PatientLinkRevokedData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
