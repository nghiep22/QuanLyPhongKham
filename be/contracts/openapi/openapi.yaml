      required: [serviceQuantity, medicineQuantity, lowStockCount, expiringBatchCount]
      properties:
        serviceQuantity: { type: string, pattern: '^-?[0-9]+(?:\\.[0-9]+)?$' }
        medicineQuantity: { type: string, pattern: '^-?[0-9]+(?:\\.[0-9]+)?$' }
        lowStockCount: { type: integer, minimum: 0 }
        expiringBatchCount: { type: integer, minimum: 0 }
    InventoryReport:
      type: object
      additionalProperties: false
      required: [summary, services, medicines, lowStock, expiringBatches]
      properties:
        summary: { $ref: '#/components/schemas/InventoryReportSummary' }
        services: { type: array, items: { $ref: '#/components/schemas/UsageReportItem' } }
        medicines: { type: array, items: { $ref: '#/components/schemas/UsageReportItem' } }
        lowStock: { type: array, items: { $ref: '#/components/schemas/LowStockReportItem' } }
        expiringBatches: { type: array, items: { $ref: '#/components/schemas/ExpiringBatchReportItem' } }
    InventoryReportResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data: { $ref: '#/components/schemas/InventoryReport' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        requestId: { $ref: '#/components/schemas/RequestId' }
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        requestId:
          $ref: '#/components/schemas/RequestId'
    ApiError:
      type: object
