          content:
            application/json:
              schema: { $ref: '#/components/schemas/PharmacyStatusResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/pharmacy/dispensation-items/{itemId}/reverse:
    post:
      operationId: reversePharmacyDispensationItem
      summary: Reverse a dispensing movement; expired or recalled stock cannot return to sellable inventory
      security: [{ bearerAuth: [] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReverseDispensationRequest' }
      responses:
        '200':
          description: Reversal movement created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PharmacyResourceResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/billing/branches:
    get:
      operationId: listBillingBranches
      summary: List branches where the actor has billing or payment permission
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Scoped billing branches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingBranchListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/billing/workspace:
    get:
      operationId: getBillingWorkspace
      summary: List billable encounters and recent invoices for one branch
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/BranchPublicIdQuery' }]
      responses:
        '200':
          description: Branch billing workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingWorkspaceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/encounters/{encounterId}/invoices:
    post:
      operationId: createEncounterInvoice
      summary: Create or return the active draft invoice for an encounter
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EncounterId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvoiceRequest' }
      responses:
        '201':
          description: Draft invoice created or returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetailResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/invoices/{invoiceId}:
    get:
      operationId: getInvoice
      summary: Get an invoice with charge, payment allocation and refund history
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
      responses:
        '200':
          description: Invoice details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetailResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/invoices/{invoiceId}/synchronize:
    post:
      operationId: synchronizeInvoiceCharges
      summary: Synchronize completed services and effective dispensations into a draft invoice
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
      responses:
        '200':
          description: Invoice charges synchronized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetailResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/invoices/{invoiceId}/items:
    post:
      operationId: addManualInvoiceItem
      summary: Add an audited manual charge to a draft invoice
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualInvoiceItemRequest' }
      responses:
        '201':
          description: Manual charge added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/invoices/{invoiceId}/insurance:
    patch:
      operationId: setInvoiceInsuranceAmount
      summary: Set the insurer-covered amount on a draft invoice
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInsuranceRequest' }
      responses:
        '200':
          description: Insurance amount updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/invoices/{invoiceId}/issue:
    post:
      operationId: issueInvoice
      summary: Atomically resynchronize all charges, pass completeness checks and issue the invoice
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/InvoiceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueInvoiceRequest' }
      responses:
        '200':
          description: Invoice issued; an identical retry returns the same invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/invoices/{invoiceId}/payments:
    post:
      operationId: recordInvoicePayment
      summary: Record a partial or full payment without exceeding the locked invoice balance
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/InvoiceId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePaymentRequest' }
      responses:
        '201':
          description: Payment recorded and allocated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/payment-allocations/{allocationId}/refunds:
    post:
      operationId: refundPaymentAllocation
      summary: Refund an amount that does not exceed the selected allocation's refundable balance
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PaymentAllocationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRefundRequest' }
      responses:
        '201':
          description: Refund recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingResourceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/invoices/{invoiceId}/void:
    post:
      operationId: voidInvoice
      summary: Void a draft or issued invoice only when net collected is zero
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingReasonRequest' }
      responses:
        '200':
          description: Invoice voided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/reports/branches:
    get:
      operationId: listReportBranches
      summary: List report branches and the caller's report capabilities
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Branch-scoped reporting capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportBranchListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/reports/operations:
    get:
      operationId: getOperationsReport
      summary: Get appointment, arrival, completion, no-show and wait-time metrics
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/BranchPublicIdQuery' }
        - { $ref: '#/components/parameters/ReportFromDate' }
        - { $ref: '#/components/parameters/ReportToDate' }
      responses:
        '200':
          description: Operational report in the branch business timezone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/reports/revenue:
    get:
      operationId: getRevenueReport
      summary: Get invoiced, collected, refunded and net-collected amounts
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/BranchPublicIdQuery' }
        - { $ref: '#/components/parameters/ReportFromDate' }
        - { $ref: '#/components/parameters/ReportToDate' }
      responses:
        '200':
          description: Revenue report grouped by business date and payment method.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevenueReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/reports/inventory:
    get:
      operationId: getInventoryReport
      summary: Get service and medicine usage with low-stock and expiring-batch alerts
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/BranchPublicIdQuery' }
        - { $ref: '#/components/parameters/ReportFromDate' }
        - { $ref: '#/components/parameters/ReportToDate' }
      responses:
        '200':
          description: Usage and inventory alert report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentAllocationId:
      name: allocationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PrescriptionId:
      name: prescriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DispensationId:
      name: dispensationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EncounterId:
      name: encounterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EncounterServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PatientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$' }
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the Base64 employee rowversion and optional doctor rowversion.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}=(:[A-Za-z0-9+/]{11}=)?"$'
    CatalogIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the Base64 rowversion of a catalog resource.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}="$'
    BranchPublicIdQuery:
      name: branchPublicId
      in: query
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$'
    ReportFromDate:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
    ReportToDate:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID that makes retries with the same operation payload return the original result.
      schema:
        type: string
        format: uuid
    PatientLinkRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientLinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientLinkIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the Base64 rowversion of the patient-link request.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}="$'
  headers:
    CatalogEtag:
      description: Strong ETag containing the Base64 SQL rowversion.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}="$'
    StaffEtag:
      description: Strong ETag for optimistic concurrency.
      schema:
        type: string
        pattern: '^"[A-Za-z0-9+/]{11}=(:[A-Za-z0-9+/]{11}=)?"$'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication data is missing, invalid, expired, reused, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: The account is unavailable for login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: The requested resource does not exist in the caller's scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: The operation conflicts with uniqueness, concurrency, or account safety rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    PreconditionRequired:
      description: The If-Match precondition is required for this update.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ServiceUnavailable:
      description: A required registration dependency is unavailable.
      content:
        application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    TooManyRequests:
      description: The caller exceeded the request rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    PatientBranch:
      type: object
      additionalProperties: false
      required: [publicId, name]
      properties:
        publicId: { type: string, pattern: '^[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$' }
        name: { type: string }
    PatientReferenceData:
      type: object
      additionalProperties: false
      required: [branches]
      properties:
        branches:
          type: array
          items: { $ref: '#/components/schemas/PatientBranch' }
    PatientReferenceResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data: { $ref: '#/components/schemas/PatientReferenceData' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        requestId: { $ref: '#/components/schemas/RequestId' }
    PatientWriteRequest:
      type: object
      required: [fullName, dateOfBirth, gender]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 200 }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        nationalId: { type: [string, 'null'], maxLength: 30 }
        healthInsuranceNo: { type: [string, 'null'], maxLength: 30 }
        phone: { type: [string, 'null'], maxLength: 20 }
        email: { type: [string, 'null'], maxLength: 254 }
        addressLine: { type: [string, 'null'], maxLength: 300 }
        province: { type: [string, 'null'], maxLength: 100 }
    PatientSearchRequest:
      type: object
      additionalProperties: false
      required: [branchPublicId]
      properties:
        branchPublicId: { type: string, pattern: '^[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$' }
        query: { type: string, minLength: 2, maxLength: 100 }
        dateOfBirth: { type: string, format: date }
    PatientDuplicateRequest:
      allOf:
        - $ref: '#/components/schemas/PatientWriteRequest'
        - type: object
          required: [branchPublicId]
          properties:
            branchPublicId: { type: string, pattern: '^[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$' }
    CreatePatientRequest:
      allOf:
        - $ref: '#/components/schemas/PatientDuplicateRequest'
        - type: object
          properties:
            duplicateOverride: { type: boolean, default: false }
            duplicateReason: { type: string, minLength: 10, maxLength: 500 }
    PatientSummary:
      type: object
      required: [publicId, code, fullName, dateOfBirth, gender, phone, status, nationalIdLast4, rowVersion]
      properties:
        publicId: { type: string, pattern: '^[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$' }
        code: { type: string }
        fullName: { type: string }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        phone: { type: [string, 'null'] }
        status: { type: string }
        nationalIdLast4: { type: [string, 'null'] }
        rowVersion: { type: string, pattern: '^[A-Za-z0-9+/]{11}=$' }
    PatientDetail:
      allOf:
        - $ref: '#/components/schemas/PatientSummary'
        - type: object
          required: [branch, nationalId, healthInsuranceNo, email, addressLine, province]
          properties:
            branch: { $ref: '#/components/schemas/PatientBranch' }
            nationalId: { type: [string, 'null'] }
            healthInsuranceNo: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            addressLine: { type: [string, 'null'] }
            province: { type: [string, 'null'] }
    PatientSummaryListResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PatientSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        requestId: { $ref: '#/components/schemas/RequestId' }
    PatientDetailResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data: { $ref: '#/components/schemas/PatientDetail' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        requestId: { $ref: '#/components/schemas/RequestId' }
    PatientClinicalSummary:
      type: object
      additionalProperties: false
      required: [patient, allergies, conditions]
      properties:
        patient:
          type: object
          additionalProperties: false
          required: [publicId, code, fullName, dateOfBirth, gender]
          properties:
            publicId: { type: string, pattern: '^[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$' }
            code: { type: string }
            fullName: { type: string }
            dateOfBirth: { type: string, format: date }
            gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        allergies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [allergenName, type, severity, reaction, notedAt]
            properties:
              allergenName: { type: string }
              type: { type: string }
              severity: { type: string }
              reaction: { type: [string, 'null'] }
              notedAt: { type: [string, 'null'], format: date }
        conditions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, name, diagnosedDate, status, notes]
            properties:
              code: { type: [string, 'null'] }
              name: { type: string }
              diagnosedDate: { type: [string, 'null'], format: date }
              status: { type: string }
              notes: { type: [string, 'null'] }
    PatientClinicalSummaryResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data: { $ref: '#/components/schemas/PatientClinicalSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        requestId: { $ref: '#/components/schemas/RequestId' }
    ResponseMeta:
      type: object
      additionalProperties: true
    RequestId:
      type: string
      format: uuid
    HealthData:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/HealthData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    DependencyHealth:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        database:
          type: string
    ReadinessData:
      type: object
      additionalProperties: false
      required: [status, service, dependencies]
      properties:
        status:
          type: string
          const: ready
        service:
          type: string
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyHealth'
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [data, meta, requestId]
      properties:
        data:
          $ref: '#/components/schemas/ReadinessData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        requestId:
          $ref: '#/components/schemas/RequestId'
    ClientType:
      type: string
      enum: [web, mobile]
      default: web
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Username, normalized email address, or normalized phone number.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 200
        clientType:
          $ref: '#/components/schemas/ClientType'
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          description: Required for mobile clients and omitted when using the web HttpOnly cookie.
    StrongPassword:
      type: string
      format: password
      minLength: 12
      maxLength: 200
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).+$'
      description: At least 12 characters with lowercase, uppercase, and a digit.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 200
        newPassword:
          $ref: '#/components/schemas/StrongPassword'
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          description: Username, normalized email address, or normalized phone number.
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: One-time opaque token received through the configured recovery channel.
        newPassword:
          $ref: '#/components/schemas/StrongPassword'
