openapi: 3.1.0
info:
  title: Private Clinic API
  version: 0.1.0
  description: Contract-first API for the private clinic management system.
servers:
  - url: http://localhost:5000/api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
        service:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
